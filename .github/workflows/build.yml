name: Build MehrSMS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.12'

    - name: Restructure Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/mehrsms
        mkdir -p app/src/main

        # ساخت کلید امضا مستقیماً داخل پوشه اصلی پروژه
        keytool -genkeypair -v -keystore release.keystore -alias keyalias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=MehrSMS, OU=Dev, O=Mehr, L=City, ST=State, C=IR"

        [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/example/mehrsms/
        [ -f SmsEngine.kt ] && mv SmsEngine.kt app/src/main/java/com/example/mehrsms/
        [ -f SmsReceiver.kt ] && mv SmsReceiver.kt app/src/main/java/com/example/mehrsms/
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
        
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "MehrSMS"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
            }
        }
        task clean(type: Delete) { delete rootProject.buildDir }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        
        android {
            namespace 'com.example.mehrsms'
            compileSdk 33

            signingConfigs {
                release {
                    storeFile file("../release.keystore")
                    storePassword "password"
                    keyAlias "keyalias"
                    keyPassword "password"
                }
            }

            defaultConfig {
                applicationId "com.example.mehrsms"
                minSdk 21
                targetSdk 33
                versionCode ${{ github.run_number }}
                versionName "1.0.${{ github.run_number }}"
                signingConfig signingConfigs.release
            }

            buildTypes {
                debug {
                    signingConfig signingConfigs.release
                }
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.recyclerview:recyclerview:1.3.0'
        }
        EOF

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MehrSMS-v${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
